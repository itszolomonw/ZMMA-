<style>
:root{--bg:#050507;--panel:#111216;--panel-hover:#1a1c23;--line:#22252d;--text:#fff;--muted:#8b92a5;--accent:#e8ff3d;--danger:#ff4d67;--blue:#4da3ff;--green:#36d98b;--gold:#ffd700}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#333;border-radius:10px}

/* --- LAYOUT --- */
.app-container{display:flex;min-height:100vh}
.sidebar{width:240px;background:#08090c;border-right:1px solid var(--line);padding:20px;position:fixed;height:100vh;overflow-y:auto;z-index:50;display:none}
@media(min-width:900px){.sidebar{display:block}}
.main-content{flex:1;padding:20px;margin-left:0}
@media(min-width:900px){.main-content{margin-left:240px;padding:40px}}

/* --- HEADER --- */
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.logo-area{display:flex;align-items:center;gap:12px}
.logo-mark{width:40px;height:40px;background:var(--accent);color:#000;display:grid;place-items:center;font-weight:900;border-radius:10px;font-size:18px}
.logo-text h1{font-size:24px;font-weight:900;letter-spacing:-1px;line-height:1}
.logo-text span{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:700}

/* --- CARDS --- */
.grid-layout{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fighter-card{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;
    position:relative;overflow:hidden;transition:all .3s cubic-bezier(.25,.8,.25,1);cursor:pointer;
    display:flex;flex-direction:column;min-height:320px;
}
.fighter-card:hover{transform:translateY(-4px);border-color:#444;background:var(--panel-hover);box-shadow:0 10px 30px rgba(0,0,0,.5)}

/* PHOTO AREA */
.photo-container{height:180px;width:100%;background:#0d0f15;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.photo-img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:.5s}
.fighter-card:hover .photo-img{transform:scale(1.05)}
.photo-fallback{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(135deg,#1a1c23,#0d0f15);font-size:48px;font-weight:900;color:rgba(255,255,255,.1);opacity:0;transition:.3s}
.photo-loading{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:2}
.spinner{width:24px;height:24px;border:2px solid #333;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* INFO AREA */
.card-info{padding:16px;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.rank-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.8);color:var(--accent);font-size:10px;font-weight:900;padding:4px 8px;border-radius:6px;z-index:3;border:1px solid rgba(255,255,255,.1)}
.rank-badge.champ{background:var(--accent);color:#000;border-color:var(--accent)}
.org-tag{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.f-name{font-size:18px;font-weight:900;letter-spacing:-.5px;line-height:1.2;color:#fff;margin-bottom:4px}
.f-nick{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:8px}
.stats-row{display:flex;gap:8px;margin-top:auto}
.stat-pill{background:rgba(255,255,255,.05);padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;color:var(--muted)}
.stat-pill.win{color:var(--green);background:rgba(54,217,139,.1)}
.stat-pill.loss{color:var(--danger);background:rgba(255,77,103,.1)}

/* --- SECTIONS & FILTERS --- */
.section-title{font-size:18px;font-weight:800;margin:30px 0 15px;display:flex;align-items:center;gap:10px}
.filters{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:5px}
.filter-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.2s}
.filter-btn:hover{border-color:var(--muted);color:var(--text)}
.filter-btn.active{background:var(--text);color:#000;border-color:var(--text)}

/* --- MODAL --- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal-content{background:#0f1115;border:1px solid #333;border-radius:20px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{padding:20px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0f1115;z-index:2}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
.modal-body{padding:24px}
.profile-hero{display:flex;gap:20px;margin-bottom:20px;align-items:center}
.avatar-placeholder{width:100px;height:100px;background:linear-gradient(135deg,#222,#111);border-radius:16px;display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--accent);border:1px solid #333;overflow:hidden}
.avatar-placeholder img{width:100%;height:100%;object-fit:cover}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.detail-item{background:rgba(255,255,255,.03);padding:12px;border-radius:10px}
.detail-label{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.detail-value{font-size:14px;font-weight:700}
.history-list{display:flex;flex-direction:column;gap:8px}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px;background:rgba(255,255,255,.02);border-radius:8px;font-size:12px}
.hist-result{font-weight:900;width:24px;height:24px;display:grid;place-items:center;border-radius:4px;font-size:10px}
.hist-win{background:rgba(54,217,139,.1);color:var(--green)}
.hist-loss{background:rgba(255,77,103,.1);color:var(--danger)}

.mob-btn.active{color:var(--accent)}

// === IMAGE RESOLVER SYSTEM (WIKIPEDIA API) ===
// Bu fonksiyon, verilen isimle Wikipedia'dan fotoğraf URL'sini çeker.
async function fetchWikiImage(name) {
    try {
        // Wikipedia API endpoint for page images
        const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles=${encodeURIComponent(name)}&prop=pageimages&pithumbsize=400`;
        const response = await fetch(url);
        const data = await response.json();
        
        const pages = Object.values(data.query.pages)[0];
        if (pages && pages.thumbnail && pages.thumbnail.source) {
            return pages.thumbnail.source;
        }
        return null; // Fotoğraf bulunamadı
    } catch (error) {
        console.error("Wiki Fetch Error:", error);
        return null;
    }
}

            </div>
        </div>
    `;
}

function renderFighters(data, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = data.map(createCardHTML).join('');
    
    // Trigger Async Image Load for each card
    data.forEach(async (f) => {
        loadFighterImage(f);
    });
}

async function loadFighterImage(f) {
    const imgEl = document.getElementById(`img-${f.id}`);
    const loaderEl = document.getElementById(`loader-${f.id}`);
    const fallbackEl = document.getElementById(`fallback-${f.id}`);
    
    if (!imgEl) return;

    // Check Cache first
    let imageUrl = imageCache[f.wikiName];
    
    if (!imageUrl) {
        // Fetch from Wikipedia
        imageUrl = await fetchWikiImage(f.wikiName);
        if(imageUrl) imageCache[f.wikiName] = imageUrl;
    }

    if (imageUrl) {
        // Success: Show image, hide loader/fallback
        imgEl.src = imageUrl;
        imgEl.onload = () => {
            imgEl.style.opacity = '1';
            loaderEl.style.display = 'none';
            fallbackEl.style.opacity = '0';
        };
        imgEl.onerror = () => {
            // If image fails to load despite having URL, revert to fallback
            imgEl.style.opacity = '0';
            loaderEl.style.display = 'none';
            fallbackEl.style.opacity = '1';
        };
    } else {
        // Fail: Hide loader, show fallback
        loaderEl.style.display = 'none';
        fallbackEl.style.opacity = '1';
    }
}

function renderNews() {
    newsGrid.innerHTML = NEWS_DB.map(n => `
        <div class="fighter-card" style="min-height:auto">
            <div class="card-info">
                <div>
                    <div class="org-tag text-accent">${n.tag}</div>
                    <div class="f-name" style="font-size:16px;margin-bottom:8px">${n.t}</div>
                    <div style="font-size:12px;color:var(--muted);line-height:1.5">${n.s}</div>
                </div>
                <div style="font-size:10px;color:var(--muted);margin-top:10px">${n.date}</div>
            </div>
        </div>
    `).join('');
}

function renderGoat() {
    const legends = DB.filter(f => f.org === 'LEGEND');
    goatGrid.innerHTML = legends.map(f => `
        <div class="fighter-card" onclick="openProfile(${f.id})" style="border-color:#333">
            <div class="photo-container">
                <div class="rank-badge" style="background:var(--gold);color:#000;border-color:var(--gold)">🐐 LEGEND</div>
                <div class="photo-loading" id="loader-g-${f.id}"><div class="spinner"></div></div>
                <div class="photo-fallback" id="fallback-g-${f.id}" style="opacity:1">${f.n.charAt(0)}</div>
                <img id="img-g-${f.id}" class="photo-img" style="opacity:0" alt="${f.n}">
            </div>
            <div class="card-info">
                <div class="f-name">${f.n}</div>
                <div class="f-nick">${f.style}</div>
                <div class="stats-row">
                    <div class="stat-pill" style="background:rgba(255,215,0,.1);color:var(--gold);border-color:rgba(255,215,0,.2)">
                        ${f.w}-${f.l}
                    </div>
                </div>
            </div>
        </div>
    `).join('');
    
    // Load Goat Images separately
    legends.forEach(async (f) => {
        const imgEl = document.getElementById(`img-g-${f.id}`);
        const loaderEl = document.getElementById(`loader-g-${f.id}`);
        const fallbackEl = document.getElementById(`fallback-g-${f.id}`);
        
        let imageUrl = imageCache[f.wikiName] || await fetchWikiImage(f.wikiName);
        if(imageUrl) {
            imageCache[f.wikiName] = imageUrl;
            imgEl.src = imageUrl;
            imgEl.onload = () => { imgEl.style.opacity='1'; loaderEl.style.display='none'; fallbackEl.style.opacity='0'; };
            imgEl.onerror = () => { imgEl.style.opacity='0'; loaderEl.style.display='none'; fallbackEl.style.opacity='1'; };
        } else {
            loaderEl.style.display='none';
            fallbackEl.style.opacity='1';
        }
    });
}

// === INTERACTION ===
window.switchPage = function(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
    document.getElementById(`page-${pageId}`).classList.remove('hidden');
    
    // Update Nav Active State
    document.querySelectorAll('.mob-btn').forEach(b => b.classList.remove('active'));
    // Find corresponding button and activate it
    const btns = Array.from(document.querySelectorAll('.mob-btn'));
    const idx = ['home','fighters','news','compare','goat'].indexOf(pageId);
    if(idx !== -1 && btns[idx]) btns[idx].classList.add('active');
};

window.filterOrg = function(org) {
    // Update buttons
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    // Filter Data
    let filtered = org === 'all' ? DB : DB.filter(f => f.org === org);
    renderFighters(filtered, 'fighterGrid');
};

// Search Logic
document.getElementById('searchInput')?.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = DB.filter(f => 
        f.n.toLowerCase().includes(q) || 
        f.country.toLowerCase().includes(q) ||
        f.div.toLowerCase().includes(q)
    );
    renderFighters(filtered, 'fullFighterGrid');
});

window.openProfile = function(id) {
    const f = DB.find(x => x.id === id);
    if(!f) return;
    
    const overlay = document.getElementById('modalOverlay');
    const body = document.getElementById('modalBody');
    const title = document.getElementById('modalTitle');
    
    title.innerText = f.n;
    
    // Generate History HTML
    let histHtml = '';
    if(f.hist && f.hist.length > 0) {
        histHtml = `<div style="margin-top:20px"><h4 style="font-size:14px;margin-bottom:10px;color:var(--muted)">SON MAÇLAR</h4><div class="history-list">` + 
        f.hist.map(h => `
            <div class="hist-item">
                <div style="display:flex;align-items:center;gap:10px">
                    <span class="hist-result ${h.res==='W'?'hist-win':'hist-loss'}">${h.res}</span>
                    <span style="font-weight:700">${h.op}</span>
                </div>
                <span style="color:var(--muted)">${h.meth} · R${h.rnd}</span>
            </div>
        `).join('') + `</div></div>`;
    } else {
        histHtml = `<div style="margin-top:20px;text-align:center;color:var(--muted);font-size:12px">Maç geçmişi verisi bulunamadı.</div>`;
    }

    // Modal Image Logic
    const modalImgId = `modal-img-${f.id}`;
    
    body.innerHTML = `
        <div class="profile-hero">
            <div class="avatar-placeholder" id="${modalImgId}-container">
                <div class="photo-loading" id="${modalImgId}-loader"><div class="spinner"></div></div>
                <div class="photo-fallback" id="${modalImgId}-fallback" style="opacity:1">${f.n.charAt(0)}</div>
                <img id="${modalImgId}" style="opacity:0;width:100%;height:100%;object-fit:cover" alt="${f.n}">
            </div>
            <div>
                <div style="font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700">${f.org} · ${f.div}</div>
                <div style="font-size:24px;font-weight:900;margin-top:4px">${f.n}</div>
                <div style="font-size:14px;color:var(--muted)">${f.nk ? '"'+f.nk+'"' : ''}</div>
            </div>
        </div>
        
        <div class="detail-grid">
            <div class="detail-item">
                <div class="detail-label">Rekor</div>
                <div class="detail-value" style="color:${f.w>f.l?'var(--green)':'var(--danger)'}">${f.w}-${f.l}-${f.d}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Stil</div>
                <div class="detail-value">${f.style}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">SLpM</div>
                <div class="detail-value">${f.slpm}</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Accuracy</div>
                <div class="detail-value">%${f.acc}</div>
            </div>
        </div>
        
        <div style="background:rgba(255,255,255,.03);padding:15px;border-radius:10px;font-size:13px;line-height:1.6;color:#ccc;margin-bottom:10px">
            ${f.country} doğumlu. ${f.champ ? 'Aktif Şampiyon.' : 'Contender/Legend.'} Güçlü yönleri: ${f.style}.
        </div>

        ${histHtml}
    `;
    
    overlay.classList.add('open');
    
    // Fetch image for modal specifically if not cached or just reuse logic
    setTimeout(() => {
        const mImg = document.getElementById(modalImgId);
        const mLoader = document.getElementById(`${modalImgId}-loader`);
        const mFallback = document.getElementById(`${modalImgId}-fallback`);
        
        if(mImg && !imageCache[f.wikiName]) {
             fetchWikiImage(f.wikiName).then(url => {
                 if(url) {
                     imageCache[f.wikiName] = url;
                     mImg.src = url;
                     mImg.onload = () => { mImg.style.opacity='1'; mLoader.style.display='none'; mFallback.style.opacity='0'; };
                     mImg.onerror = () => { mImg.style.opacity='0'; mLoader.style.display='none'; mFallback.style.opacity='1'; };
                 } else {
                     mLoader.style.display='none';
                     mFallback.style.opacity='1';
                 }
             });
        } else if (mImg && imageCache[f.wikiName]) {
             mImg.src = imageCache[f.wikiName];
             mImg.onload = () => { mImg.style.opacity='1'; mLoader.style.display='none'; mFallback.style.opacity='0'; };
        }
    }, 100);
};

window.closeModal = function(e) {
    if(e.target.id === 'modalOverlay') {
        document.getElementById('modalOverlay').classList.remove('open');
    }
};

// === COMPARE LOGIC (Simple Radar) ===
let myChart = null;
function initCompare() {
    const selA = document.getElementById('cmpA');
    const selB = document.getElementById('cmpB');
    
    const options = DB.map(f => `<option value="${f.id}">${f.n}</option>`).join('');
    selA.innerHTML = options;
    selB.innerHTML = options;
    selA.value = 1; 
    selB.value = 3; 
    
    selA.onchange = updateRadar;
    selB.onchange = updateRadar;
    
    updateRadar();
}

function updateRadar() {
    const f1 = DB.find(x => x.id == document.getElementById('cmpA').value);
    const f2 = DB.find(x => x.id == document.getElementById('cmpB').value);
    
    const ctx = document.getElementById('radarChart').getContext('2d');
    if(myChart) myChart.destroy();
    
    myChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['Power (SLpM)', 'Accuracy', 'Defense', 'Takedown', 'Submission'],
            datasets: [{
                label: f1.n,
                data: [f1.slpm * 10, f1.acc, 100-f1.acc+20, f1.td * 10, f1.sub * 20],
                borderColor: '#e8ff3d',
                backgroundColor: 'rgba(232, 255, 61, 0.1)',
                pointBackgroundColor: '#e8ff3d'
            }, {
                label: f2.n,
                data: [f2.slpm * 10, f2.acc, 100-f2.acc+20, f2.td * 10, f2.sub * 20],
                borderColor: '#4da3ff',
                backgroundColor: 'rgba(77, 163, 255, 0.1)',
                pointBackgroundColor: '#4da3ff'
            }]
        },
        options: {
            responsive: true,
            scales: {
                r: {
                    angleLines: { color: '#333' },
                    grid: { color: '#222' },
                    pointLabels: { color: '#888', font: { size: 10 } },
                    ticks: { display: false }
                }
            },
            plugins: { legend: { labels: { color: '#fff' } } }
        }
    });
}
