<style>
:root {
    --bg: #0a0a0f;
    --surface: #16161e;
    --surface-light: #1f1f2e;
    --primary: #ccff00; /* Neon Lime */
    --text: #ffffff;
    --text-muted: #8b8b9e;
    --danger: #ff4757;
    --success: #2ed573;
    --border: rgba(255,255,255,0.08);
    --glass: rgba(22, 22, 30, 0.7);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    padding-bottom: 80px; /* Space for bottom nav */
}

/* --- UTILS --- */
.hidden { display: none !important; }
.flex { display: flex; }
.col { flex-direction: column; }
.center { align-items: center; justify-content: center; }
.between { justify-content: space-between; }
.gap-sm { gap: 8px; }
.gap-md { gap: 16px; }

/* --- HEADER --- */
header {
    position: sticky; top: 0; z-index: 90;
    background: rgba(10, 10, 15, 0.85);
    backdrop-filter: blur(12px);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
}
.logo { font-size: 24px; font-weight: 900; letter-spacing: -1px; color: var(--primary); }
.logo span { color: white; }

/* --- HERO SECTION --- */
.hero {
    padding: 20px;
    background: linear-gradient(180deg, rgba(204,255,0,0.1) 0%, rgba(10,10,15,0) 100%);
    margin-bottom: 10px;
}
.hero h1 { font-size: 28px; line-height: 1.1; margin-bottom: 8px; }
.hero p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }

/* --- FILTERS --- */
.filters {
    display: flex; gap: 10px; overflow-x: auto; padding: 0 20px 15px;
    scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.chip {
    background: var(--surface); border: 1px solid var(--border);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    white-space: nowrap; color: var(--text-muted); transition: 0.2s;
}
.chip.active { background: var(--primary); color: #000; border-color: var(--primary); }

/* --- GRID & CARDS --- */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 20px; }
@media(min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media(min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

.card {
    background: var(--surface); border-radius: 16px; overflow: hidden;
    border: 1px solid var(--border); position: relative;
    transition: transform 0.2s; cursor: pointer;
    display: flex; flex-direction: column;
}
.card:active { transform: scale(0.98); }

.card-img-wrapper {
    height: 160px; width: 100%; background: #000; position: relative; overflow: hidden;
}
.card-img {
    width: 100%; height: 100%; object-fit: cover; object-position: top center;
    opacity: 0; transition: opacity 0.3s;
}
.card-img.loaded { opacity: 1; }
.card-fallback {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900; color: rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #1a1a24, #0f0f15);
}
.card-badge {
    position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px); padding: 4px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 800; color: var(--primary); z-index: 2;
}
.card-badge.champ { background: var(--primary); color: #000; }

.card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.card-org { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
.card-name { font-size: 15px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; }
.card-record { font-size: 12px; color: var(--text-muted); font-weight: 600; }

/* --- BOTTOM NAV --- */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 70px;
    background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    z-index: 100; padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer;
    transition: 0.2s;
}
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; }

/* --- FULL SCREEN MODAL (PROFILE) --- */
.modal-overlay {
    position: fixed; inset: 0; background: var(--bg); z-index: 200;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    overflow-y: auto; display: flex; flex-direction: column;
}
.modal-overlay.open { transform: translateY(0); }

.modal-header {
    position: sticky; top: 0; z-index: 10; padding: 16px 20px;
    background: rgba(10,10,15,0.9); backdrop-filter: blur(10px);
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border);
}
.close-btn { background: var(--surface); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; }

.profile-hero { position: relative; height: 300px; width: 100%; }
.profile-hero img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.profile-hero-overlay {
    position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
    background: linear-gradient(to top, var(--bg), transparent);
}
.profile-info { padding: 0 20px; margin-top: -40px; position: relative; z-index: 2; }
.profile-name { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-bottom: 4px; }
.profile-meta { color: var(--primary); font-weight: 700; font-size: 14px; margin-bottom: 16px; }

.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
.stat-box { background: var(--surface); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
.stat-val { font-size: 18px; font-weight: 800; color: white; }
.stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

.section-title { font-size: 16px; font-weight: 800; margin: 24px 0 12px; color: white; }
.history-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; background: var(--surface); border-radius: 12px; margin-bottom: 8px;
    border: 1px solid var(--border);
}
.hist-res { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 12px; font-weight: 900; }
.hist-win { background: rgba(46, 213, 115, 0.1); color: var(--success); }
.hist-loss { background: rgba(255, 71, 87, 0.1); color: var(--danger); }

/* --- NEWS CARD --- */
.news-card {
    background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border);
}
.news-tag { font-size: 10px; font-weight: 800; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; display: block; }
.news-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
.news-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

/* --- COMPARE --- */
.compare-container { padding: 20px; }
.vs-select { width: 100%; background: var(--surface); border: 1px solid var(--border); color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; }
.chart-container { position: relative; height: 300px; width: 100%; margin-top: 20px; background: var(--surface); border-radius: 16px; padding: 10px; }

</style>
</head>

        const res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&titles=${encodeURIComponent(name)}&prop=pageimages&pithumbsize=500`);
        const data = await res.json();
        const pages = Object.values(data.query.pages)[0];
        if(pages && pages.thumbnail) {
            imgCache[name] = pages.thumbnail.source;
            return pages.thumbnail.source;
        }
    } catch(e) { console.log("Wiki fail", e); }
    return null;
}

function renderCard(f) {
    const initials = f.n.split(' ').map(w=>w[0]).join('').substring(0,2);
    return `
    <div class="card" onclick="openProfile(${f.id})">
        <div class="card-img-wrapper">
            <div class="card-badge ${f.champ?'champ':''}">#${f.rank||'-'} ${f.champ?'👑':''}</div>
            <div class="card-fallback">${initials}</div>
            <img class="card-img" data-wiki="${f.wiki}" onload="this.classList.add('loaded')" onerror="this.style.display='none'">
        </div>
        <div class="card-body">
            <div>
                <div class="card-org">${f.org} · ${f.div}</div>
                <div class="card-name">${f.n}</div>
            </div>
            <div class="card-record">${f.w}-${f.l}-${f.d}</div>
        </div>
    </div>`;
}

function loadImages() {
    document.querySelectorAll('.card-img').forEach(async (img) => {
        if(img.src) return; // Already loaded
        const wikiName = img.dataset.wiki;
        const url = await getWikiUrl(wikiName);
        if(url) img.src = url;
    });
}

// === RENDER FUNCTIONS ===
function renderHome(filter='all') {
    const list = filter==='all' ? DB : DB.filter(f=>f.org===filter);
    document.getElementById('homeGrid').innerHTML = list.slice(0,8).map(renderCard).join('');
    document.getElementById('homeNews').innerHTML = NEWS.slice(0,3).map(n=>`
        <div class="news-card">
            <span class="news-tag">${n.tag}</span>
            <div class="news-title">${n.t}</div>
            <div class="news-desc">${n.s}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:8px">${n.d}</div>
        </div>
    `).join('');
    setTimeout(loadImages, 100);
}

function renderFighters(q='') {
    const list = DB.filter(f => 
        f.n.toLowerCase().includes(q.toLowerCase()) || 
        f.c.toLowerCase().includes(q.toLowerCase())
    );
    document.getElementById('fightersGrid').innerHTML = list.map(renderCard).join('');
    setTimeout(loadImages, 100);
}

function renderNews() {
    document.getElementById('newsGrid').innerHTML = NEWS.map(n=>`
        <div class="news-card">
            <span class="news-tag">${n.tag}</span>
            <div class="news-title">${n.t}</div>
            <div class="news-desc">${n.s}</div>
            <div style="font-size:10px;color:var(--text-muted);margin-top:8px">${n.d}</div>
        </div>
    `).join('');
}

// === PROFILE MODAL (FULL SCREEN) ===
window.openProfile = async function(id) {
    const f = DB.find(x=>x.id===id);
    if(!f) return;
    
    const modal = document.getElementById('profileModal');
    const content = document.getElementById('profileContent');
    
    // Initial Render with Fallback
    const initials = f.n.split(' ').map(w=>w[0]).join('').substring(0,2);
    content.innerHTML = `
        <div class="profile-hero">
            <div class="card-fallback" style="font-size:80px">${initials}</div>
            <img id="prof-img" style="opacity:0;transition:0.3s" onload="this.style.opacity=1">
            <div class="profile-hero-overlay"></div>
        </div>
        <div class="profile-info">
            <div class="profile-meta">${f.org} · ${f.div} · ${f.c}</div>
            <div class="profile-name">${f.n}</div>
            <div style="color:var(--text-muted);font-style:italic;margin-bottom:20px">${f.nk?'"'+f.nk+'"':''}</div>
            
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-val">${f.w}-${f.l}</div><div class="stat-label">Record</div></div>
                <div class="stat-box"><div class="stat-val">${f.sl}</div><div class="stat-label">SLpM</div></div>
                <div class="stat-box"><div class="stat-val">%${f.ac}</div><div class="stat-label">Accuracy</div></div>
            </div>

            <div class="section-title">Son Maçlar</div>
            <div id="prof-hist">
                ${f.hist.length ? f.hist.map(h=>`
                    <div class="history-item">
                        <div class="flex gap-sm center">
                            <div class="hist-res ${h.r==='W'?'hist-win':'hist-loss'}">${h.r}</div>
                            <span style="font-weight:700">${h.o}</span>
                        </div>
                        <span style="color:var(--text-muted);font-size:12px">${h.m} · R${h.rd}</span>
                    </div>
                `).join('') : '<div style="color:var(--text-muted);font-size:13px">Veri bulunamadı.</div>'}
            </div>
            
            <div style="height:40px"></div>
        </div>
    `;
    
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
    
    // Fetch Image for Profile
    const imgUrl = await getWikiUrl(f.wiki);
    if(imgUrl) {
        const imgEl = document.getElementById('prof-img');
        if(imgEl) imgEl.src = imgUrl;
    }
};

window.closeProfile = function() {
    document.getElementById('profileModal').classList.remove('open');
    document.body.style.overflow = '';
};

// === NAVIGATION ===
window.nav = function(page) {
    document.querySelectorAll('.page').forEach(p=>p.classList.add('hidden'));
    document.getElementById(`page-${page}`).classList.remove('hidden');
    
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    event.currentTarget.classList.add('active');
    
    if(page==='fighters') renderFighters();
    if(page==='news') renderNews();
    if(page==='home') renderHome();
    if(page==='compare') initCompare();
};

window.filterHome = function(org) {
    document.querySelectorAll('#homeFilters .chip').forEach(c=>c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    renderHome(org);
};

document.getElementById('searchInput').addEventListener('input', (e) => {
    renderFighters(e.target.value);
});

// === COMPARE CHART ===
let chartInstance = null;
function initCompare() {
    const selA = document.getElementById('cmpA');
    const selB = document.getElementById('cmpB');
    const opts = DB.map(f=>`<option value="${f.id}">${f.n}</option>`).join('');
    selA.innerHTML = opts; selB.innerHTML = opts;
    selA.value = 1; selB.value = 3;
    
    const update = () => {
        const f1 = DB.find(x=>x.id==selA.value);
        const f2 = DB.find(x=>x.id==selB.value);
        const ctx = document.getElementById('radarChart').getContext('2d');
        
        if(chartInstance) chartInstance.destroy();
        
        chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Striking', 'Accuracy', 'Grappling', 'Submissions', 'Power'],
                datasets: [{
                    label: f1.n, data: [f1.sl*10, f1.ac, f1.td*10, f1.sb*20, f1.w],
                    borderColor: '#ccff00', backgroundColor: 'rgba(204,255,0,0.1)', pointBackgroundColor: '#ccff00'
                }, {
                    label: f2.n, data: [f2.sl*10, f2.ac, f2.td*10, f2.sb*20, f2.w],
                    borderColor: '#4da3ff', backgroundColor: 'rgba(77,163,255,0.1)', pointBackgroundColor: '#4da3ff'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { r: { angleLines: {color:'#333'}, grid: {color:'#222'}, pointLabels: {color:'#888'}, ticks: {display:false} } },
                plugins: { legend: { labels: {color:'#fff'} } }
            }
        });
    };
    
    selA.onchange = update; selB.onchange = update;
    update();
}

// === INIT ===
renderHome();
</script>
</body>
