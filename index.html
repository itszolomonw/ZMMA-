<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>ZMMA — MMA Hub</title>
<style>
:root{--bg:#08090d;--panel:#11141b;--p2:#151923;--p3:#1a1f2a;--line:#242a36;--text:#f4f5f7;--muted:#8d95a5;--m2:#687080;--acc:#e8ff3d;--red:#ff4d67;--blue:#4da3ff;--green:#36d98b;--orange:#ff9f43}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--bg)}
body{min-height:100vh;background:radial-gradient(circle at 85% 0,rgba(232,255,61,.055),transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit;background:none}
.topbar{position:sticky;top:0;z-index:100;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(8,9,13,.86);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.055)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:21px;letter-spacing:-.04em}
.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--acc);color:#08090d;font-size:14px}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.15em;margin-top:-2px}
.top-actions{display:flex;gap:8px}
.icon-btn,.lang-btn{height:40px;min-width:40px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:13px}
.lang-btn span{color:var(--acc)}
.desktop-nav{position:fixed;left:0;top:68px;bottom:0;width:220px;padding:20px 14px;border-right:1px solid rgba(255,255,255,.055);background:#090a0f;z-index:70}
.nav-label{padding:0 12px 9px;color:var(--m2);font-size:10px;letter-spacing:.14em;font-weight:900}
.nav-item{width:100%;min-height:44px;display:flex;align-items:center;gap:12px;padding:0 13px;margin-bottom:3px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:800;text-align:left}
.nav-item:hover{color:var(--text);background:var(--panel)}
.nav-item.active{color:var(--text);background:linear-gradient(90deg,rgba(232,255,61,.13),rgba(232,255,61,.02));box-shadow:inset 2px 0 0 var(--acc)}
.mobile-nav{display:none}
.main{margin-left:220px;padding:28px 32px 80px;max-width:1500px}
.page{display:none}.page.active{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.eyebrow{color:var(--acc);font-size:10px;font-weight:900;letter-spacing:.18em;margin-bottom:8px}
h1{font-size:clamp(30px,4vw,46px);line-height:1;letter-spacing:-.05em}
.sub{margin:10px 0 24px;color:var(--muted);font-size:14px;max-width:650px;line-height:1.6}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:36px 0 14px}
